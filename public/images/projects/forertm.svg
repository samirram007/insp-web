<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <title>foreRTM – Real Time Market price and volume forecasting, launched 14 January 2022</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1030"/>
      <stop offset="1" stop-color="#2f2a86"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eb2fc"/>
      <stop offset="1" stop-color="#27cbff"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eb2fc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5eb2fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  <rect width="720" height="540" fill="url(#bg)"/>

  <!-- price/volume chart -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1">
    <line x1="90" y1="120" x2="90" y2="400"/>
    <line x1="90" y1="400" x2="530" y2="400"/>
    <line x1="90" y1="190" x2="530" y2="190" stroke-dasharray="4 9"/>
    <line x1="90" y1="270" x2="530" y2="270" stroke-dasharray="4 9"/>
  </g>
  <path d="M90 360 C150 330 190 250 260 265 S370 350 440 280 510 175 530 190 L530 400 L90 400 Z" fill="url(#fill)"/>
  <path d="M90 360 C150 330 190 250 260 265 S370 350 440 280 510 175 530 190" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="530" cy="190" r="8" fill="#27cbff"/>
  <circle cx="530" cy="190" r="16" fill="none" stroke="#27cbff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- half-hourly auction session blocks (48 per day) -->
  <g fill="#5eb2fc" opacity="0.75">
    <rect x="90" y="418" width="9" height="26" rx="2"/>
    <rect x="103" y="410" width="9" height="34" rx="2"/>
    <rect x="116" y="422" width="9" height="22" rx="2"/>
    <rect x="129" y="404" width="9" height="40" rx="2"/>
    <rect x="142" y="414" width="9" height="30" rx="2"/>
    <rect x="155" y="398" width="9" height="46" rx="2"/>
    <rect x="168" y="418" width="9" height="26" rx="2"/>
    <rect x="181" y="406" width="9" height="38" rx="2"/>
  </g>

  <!-- launch badge: 14.01.2022 -->
  <g>
    <rect x="560" y="60" width="120" height="120" rx="18" fill="url(#card)" stroke="#27cbff" stroke-width="2.5"/>
    <text x="620" y="100" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">14</text>
    <text x="620" y="124" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#27cbff" letter-spacing="3">JAN</text>
    <text x="620" y="152" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.85)">2022</text>
  </g>

  <!-- 25-min forecast callout -->
  <g>
    <rect x="560" y="210" width="120" height="70" rx="14" fill="url(#card)" stroke="rgba(94,178,252,0.7)" stroke-width="2"/>
    <text x="620" y="240" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">25 min</text>
    <text x="620" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="rgba(255,255,255,0.75)">ahead of auction</text>
  </g>

  <!-- lightning bolt -->
  <path d="M596 320 l-26 54 h20 l-12 46 40 -64 h-22 l16 -36 z" fill="#27cbff" opacity="0.95"/>

  <text x="90" y="478" font-family="Poppins, Arial, sans-serif" font-size="27" font-weight="700" fill="rgba(255,255,255,0.95)">foreRTM</text>
  <text x="90" y="506" font-family="Inter, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)">Real Time Market price &amp; volume forecasting · 48 sessions a day</text>
</svg>
