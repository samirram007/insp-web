<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1030"/>
      <stop offset="1" stop-color="#3b2f9e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27cbff"/>
      <stop offset="1" stop-color="#513ebd"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eb2fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5eb2fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="540" fill="url(#bg)"/>
  <!-- AI chip -->
  <g>
    <rect x="500" y="70" width="130" height="130" rx="16" fill="rgba(39,203,255,0.12)" stroke="#27cbff" stroke-width="3"/>
    <rect x="535" y="105" width="60" height="60" rx="8" fill="#27cbff" opacity="0.9"/>
    <g stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round">
      <line x1="500" y1="100" x2="470" y2="100"/><line x1="500" y1="135" x2="470" y2="135"/><line x1="500" y1="170" x2="470" y2="170"/>
      <line x1="630" y1="100" x2="660" y2="100"/><line x1="630" y1="135" x2="660" y2="135"/><line x1="630" y1="170" x2="660" y2="170"/>
      <line x1="535" y1="70" x2="535" y2="40"/><line x1="565" y1="70" x2="565" y2="40"/><line x1="595" y1="70" x2="595" y2="40"/>
      <line x1="535" y1="200" x2="535" y2="230"/><line x1="565" y1="200" x2="565" y2="230"/><line x1="595" y1="200" x2="595" y2="230"/>
    </g>
    <text x="565" y="146" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="800" fill="#0e1030">AI</text>
  </g>
  <!-- price bars -->
  <g fill="url(#bar)">
    <rect x="90" y="330" width="46" height="130" rx="5"/>
    <rect x="160" y="290" width="46" height="170" rx="5"/>
    <rect x="230" y="360" width="46" height="100" rx="5"/>
    <rect x="300" y="250" width="46" height="210" rx="5"/>
    <rect x="370" y="310" width="46" height="150" rx="5"/>
  </g>
  <!-- forecast trend -->
  <path d="M80 320 Q200 250 320 270 T580 180 L640 150" fill="none" stroke="#27cbff" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 320 Q200 250 320 270 T580 180 L640 150 L640 460 L80 460 Z" fill="url(#area)" opacity="0.4"/>
  <circle cx="640" cy="150" r="9" fill="#27cbff"/>
  <text x="90" y="90" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">foreDAM</text>
  <text x="90" y="120" font-family="Inter, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">AI-enabled Day Ahead Market forecasting · IEX</text>
</svg>
