<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12142e"/>
      <stop offset="1" stop-color="#274a8f"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27cbff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#27cbff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="540" fill="url(#bg)"/>
  <!-- steam plumes -->
  <ellipse cx="300" cy="120" rx="55" ry="70" fill="url(#steam)"/>
  <ellipse cx="400" cy="95" rx="60" ry="85" fill="url(#steam)"/>
  <!-- cooling towers -->
  <path d="M240 420 C250 300 270 240 265 210 L345 210 C340 240 360 300 370 420 Z" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
  <path d="M340 430 C350 310 370 250 365 220 L445 220 C440 250 460 310 470 430 Z" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  <!-- plant block -->
  <g fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.6)" stroke-width="3">
    <rect x="470" y="330" width="180" height="90" rx="6"/>
    <rect x="500" y="270" width="90" height="60" rx="6"/>
  </g>
  <g fill="#27cbff" opacity="0.85">
    <rect x="492" y="352" width="22" height="16"/><rect x="530" y="352" width="22" height="16"/><rect x="568" y="352" width="22" height="16"/><rect x="606" y="352" width="22" height="16"/>
    <rect x="518" y="292" width="18" height="14"/><rect x="552" y="292" width="18" height="14"/>
  </g>
  <!-- URS software window -->
  <g>
    <rect x="80" y="240" width="180" height="130" rx="10" fill="rgba(14,16,48,0.85)" stroke="#5eb2fc" stroke-width="3"/>
    <line x1="80" y1="270" x2="260" y2="270" stroke="#5eb2fc" stroke-width="3"/>
    <circle cx="100" cy="255" r="5" fill="#27cbff"/><circle cx="118" cy="255" r="5" fill="#5eb2fc"/><circle cx="136" cy="255" r="5" fill="#513ebd"/>
    <rect x="96" y="288" width="148" height="10" rx="4" fill="rgba(94,178,252,0.8)"/>
    <rect x="96" y="310" width="110" height="10" rx="4" fill="rgba(94,178,252,0.55)"/>
    <rect x="96" y="332" width="130" height="10" rx="4" fill="rgba(94,178,252,0.4)"/>
  </g>
  <text x="90" y="490" font-family="Poppins, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">NTPC Khargone · URS</text>
  <text x="90" y="516" font-family="Inter, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.72)">Software development &amp; maintenance for a supercritical thermal plant</text>
</svg>
