<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2140"/>
      <stop offset="1" stop-color="#2b5aa8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27cbff"/>
      <stop offset="1" stop-color="#5eb2fc"/>
    </linearGradient>
  </defs>
  <rect width="720" height="540" fill="url(#bg)"/>
  <!-- solar panels -->
  <g>
    <path d="M80 300 L200 300 L180 380 L60 380 Z" fill="url(#panel)" opacity="0.9"/>
    <path d="M220 300 L340 300 L320 380 L200 380 Z" fill="url(#panel)" opacity="0.75"/>
    <g stroke="rgba(255,255,255,0.55)" stroke-width="2">
      <line x1="95" y1="322" x2="188" y2="322"/><line x1="90" y1="348" x2="184" y2="348"/>
      <line x1="235" y1="322" x2="328" y2="322"/><line x1="230" y1="348" x2="324" y2="348"/>
      <line x1="140" y1="300" x2="120" y2="380"/><line x1="280" y1="300" x2="260" y2="380"/>
    </g>
    <rect x="125" y="380" width="12" height="30" fill="rgba(255,255,255,0.5)"/>
    <rect x="265" y="380" width="12" height="30" fill="rgba(255,255,255,0.5)"/>
  </g>
  <!-- wind turbine -->
  <g stroke="rgba(255,255,255,0.9)" stroke-width="9" stroke-linecap="round">
    <line x1="520" y1="160" x2="520" y2="410"/>
    <line x1="520" y1="160" x2="452" y2="200"/>
    <line x1="520" y1="160" x2="588" y2="200"/>
    <line x1="520" y1="160" x2="486" y2="96"/>
  </g>
  <circle cx="520" cy="160" r="13" fill="#ffffff"/>
  <!-- curtailment chart -->
  <g stroke="rgba(94,178,252,0.55)" stroke-width="2.5" fill="none">
    <path d="M60 470 Q180 430 300 458 T650 448"/>
  </g>
  <circle cx="650" cy="448" r="7" fill="#27cbff"/>
  <text x="60" y="510" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700" fill="rgba(255,255,255,0.95)">REMS</text>
  <text x="60" y="534" font-family="Inter, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)">Renewable Energy Management System · curtailment repository</text>
</svg>
