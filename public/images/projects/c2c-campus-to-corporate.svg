<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a3f"/>
      <stop offset="1" stop-color="#4335c9"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eb2fc"/>
      <stop offset="1" stop-color="#27cbff"/>
    </linearGradient>
  </defs>
  <rect width="720" height="540" fill="url(#bg)"/>
  <!-- graduation cap -->
  <g transform="translate(150,150)">
    <path d="M0 40 L70 10 L140 40 L70 70 Z" fill="rgba(255,255,255,0.92)"/>
    <path d="M28 52 v30 c0 12 84 12 84 0 v-30 l-42 17 z" fill="rgba(255,255,255,0.65)"/>
    <line x1="140" y1="40" x2="140" y2="92" stroke="#27cbff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="140" cy="100" r="8" fill="#27cbff"/>
  </g>
  <!-- path steps campus -> corporate -->
  <g>
    <rect x="360" y="330" width="70" height="34" rx="8" fill="url(#step)" opacity="0.45"/>
    <rect x="440" y="280" width="70" height="84" rx="8" fill="url(#step)" opacity="0.65"/>
    <rect x="520" y="230" width="70" height="134" rx="8" fill="url(#step)" opacity="0.85"/>
    <rect x="600" y="180" width="60" height="184" rx="8" fill="#27cbff"/>
  </g>
  <path d="M380 310 L620 150" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="620" cy="150" r="8" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">
    <text x="360" y="392">Campus</text>
    <text x="596" y="392">Corporate</text>
  </g>
  <text x="90" y="480" font-family="Poppins, Arial, sans-serif" font-size="27" font-weight="700" fill="rgba(255,255,255,0.95)">C2C – Campus to Corporate</text>
  <text x="90" y="508" font-family="Inter, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)">A masterclass to your dream job in the Power Sector</text>
</svg>
